<!DOCTYPE html>
{% load static %}
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Добавить оценку</title>
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
    </head>
    <body id="form-page">
        <div>
            <h1>Добавить оценку</h1>
            <form method="POST">
                {% csrf_token %}
                <div>
                    <p>Учитель</p>
                    <input type="text" value="{{ teacher.fullname }}" readonly>
                </div>
                <div>
                    <p>Ученик</p>
                    <select name="student_id" id="student_id" required>
                        {% for student in students %}
                            <option value="{{ student.id }}">{{ student.fullname }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <p>Оценка</p>
                    <input type="number" name="grade" id="grade" placeholder="Оценка" step="1" required>
                </div>
                <div>
                    Присутствовал
                    <input type="checkbox" name="status" id="status" value="on" checked>
                    <p>Снимите отметку, если ученик отсутствовал.</p>
                </div>
                <div>
                    <p>Причина отсутствия</p>
                    <input type="text" name="comment" id="comment" placeholder="Причина отсутствия" maxlength="200">
                </div>
                <div>
                    <p>Дата занятия</p>
                    <input type="date" name="data" id="data" required>
                </div>
                <div>
                    <button type="submit">Сохранить</button>
                    <a href="http://127.0.0.1:8000/get_grades/">Оценки</a>
                    <a href="http://127.0.0.1:8000/">Главная</a>
                </div>
            </form>
        </div>
    </body>
</html>
