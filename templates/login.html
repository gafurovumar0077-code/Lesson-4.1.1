<!DOCTYPE html>
{% load static %}
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Вход</title>
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
    </head>
    <body>
        <div>
            <h1>Вход</h1>
            <form method="POST">
                {% csrf_token %}
                <div>
                    <input type="text" name="username" id="username" placeholder="Логин" maxlength="150" autocomplete="username" required>
                </div>
                <div>
                    <input type="password" name="password" id="password" placeholder="Пароль" autocomplete="current-password" required>
                </div>
                <div>
                    <button type="submit">Войти</button>
                    <a href="http://127.0.0.1:8000/registration/">Регистрация</a>
                    <a href="http://127.0.0.1:8000/">Главная</a>
                </div>
            </form>
        </div>
    </body>
</html>
