<!DOCTYPE html>
{% load static %}
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Добавить ученика</title>
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
    </head>
    <body id="form-page">
        <div>
            <h1>Добавить ученика</h1>
            <form method="POST">
                {% csrf_token %}
                <div>
                    <p>Пользователь</p>
                    <select name="user_id" id="user_id" required>
                        {% for user in users %}
                            <option value="{{ user.id }}">{{ user.username }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <input type="text" name="fullname" id="fullname" placeholder="ФИО ученика" maxlength="200" required>
                </div>
                <div>
                    <p>Группа</p>
                    <select name="classroom_id" id="classroom_id" required>
                        {% for classroom in classrooms %}
                            <option value="{{ classroom.id }}">{{ classroom.title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <input type="text" name="phone" id="phone" placeholder="Телефон" maxlength="13" required>
                </div>
                <div>
                    <button type="submit">Сохранить</button>
                    <a href="http://127.0.0.1:8000/get_students/">Все ученики</a>
                    <a href="http://127.0.0.1:8000/">Главная</a>
                </div>
            </form>
        </div>
    </body>
</html>
