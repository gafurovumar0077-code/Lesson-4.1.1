<!DOCTYPE html>
{% load static %}
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Главная</title>
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
    </head>
    <body id="home-page">
        <h1>Учебный журнал</h1>

        <div id="sidebar">
            <h1>Кабинеты</h1>
            <div>
                <a href="http://127.0.0.1:8000/administrator/">Администратор</a>
                <a href="http://127.0.0.1:8000/teacher/">Учитель</a>
                <a href="http://127.0.0.1:8000/student/">Ученик</a>
            </div>
        </div>

        <div>
            <h1>Аккаунт</h1>
            <div>
                <a href="http://127.0.0.1:8000/login/">Вход</a>
                <a href="http://127.0.0.1:8000/registration/">Регистрация</a>
                <form method="POST" action="http://127.0.0.1:8000/logout/">
                    {% csrf_token %}
                    <button type="submit">Выйти</button>
                </form>
            </div>
        </div>

        
    </body>
</html>
