<!DOCTYPE html>
{% load static %}
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Изменить класс</title>
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
    </head>
    <body>
        <div>
            <h1>Изменить класс</h1>
            <form method="POST">
                {% csrf_token %}
                <div>
                    <input type="text" name="title" id="title" placeholder="Название класса" value="{{ classroom.title }}" maxlength="140" required>
                </div>
                <div>
                    <p>Учитель</p>
                    <select name="teacher" id="teacher" required>
                        <option value="{{ classroom.teacher_id }}">{{ classroom.teacher.fullname }}</option>
                        {% for teacher in teachers %}
                            <option value="{{ teacher.id }}">{{ teacher.fullname }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <button type="submit">Сохранить</button>
                    <a href="http://127.0.0.1:8000/get_classrooms/">Все классы</a>
                    <a href="http://127.0.0.1:8000/">Главная</a>
                </div>
            </form>
        </div>
    </body>
</html>
