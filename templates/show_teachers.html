<!DOCTYPE html>
{% load static %}
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Учителя</title>
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
    </head>
    <body>
        <h1>Учителя</h1>
        {% for teacher in teachers %}
            <div>
                <div>
                    <div>
                        <h1>{{ teacher.fullname }}</h1>
                        <h2>Предмет: {{ teacher.subject }}</h2>
                        <p>Телефон: {{ teacher.phone }}</p>
                        <p>Пользователь: {{ teacher.user.username }}</p>
                    </div>
                </div>
                <div>
                    <a href="http://127.0.0.1:8000/update_teacher/{{ teacher.id }}/">Изменить</a>
                    <a href="http://127.0.0.1:8000/delete_teacher/{{ teacher.id }}/">Удалить</a>
                </div>
            </div>
        {% endfor %}
        <div>
            <a href="http://127.0.0.1:8000/create_teacher/">Добавить учителя</a>
            <a href="http://127.0.0.1:8000/">Главная</a>
        </div>
    </body>
</html>
